# Každé ráno stiahne nové akcie, uloží ich do repozitára a zverejní apku na GitHub Pages.
name: Aktualizácia akcií

on:
  schedule:
    - cron: '17 4 * * *'      # denne ~5:17 SEČ / 6:17 SELČ (GitHub počíta v UTC)
    - cron: '47 14 * * 2,3'   # utorok a streda poobede – vtedy vychádzajú nové letáky
  workflow_dispatch:          # tlačidlo „Run workflow“ na ručné spustenie
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # vždy najnovší stav (aj dáta, ktoré medzitým uložil iný beh), nie commit, ktorý beh spustil
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Testy
        run: npm test
      - name: Knižnica na čítanie PDF letáku Albertu (len pre scraper, apka ju nepotrebuje)
        if: github.event_name != 'push'
        run: npm install --no-save --no-package-lock pdfjs-dist@4.10.38
      - name: Stiahnuť akcie
        if: github.event_name != 'push'
        run: node scraper/run.js
      - name: Stiahnuť predajne (raz za týždeň)
        if: github.event_name != 'push'
        run: node scraper/stores.js
        continue-on-error: true
      - name: Uložiť nové dáta
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data data/price-history.json
          git diff --cached --quiet || git commit -m "data: akcie $(date -u +%F)"
          git pull --rebase --autostash || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
